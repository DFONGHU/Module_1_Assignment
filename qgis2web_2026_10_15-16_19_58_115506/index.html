<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1992年東涌調查Box B21照片定位</title>
<link rel="stylesheet" href="css/leaflet.css">
<link rel="stylesheet" href="css/MarkerCluster.css">
<link rel="stylesheet" href="css/MarkerCluster.Default.css">
<style>
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --border: #d9dee5;
  --text: #1f2933;
  --muted: #5f6b7a;
  --accent: #c22b3a;
  --accent-dark: #8f1e2a;
  --highlight: #ffd400;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  background: var(--bg); color: var(--text);
}
#app { display: flex; flex-direction: column; height: 100%; }
header {
  background: #00785D; border-bottom: 1px solid #005c46;
  padding: 8px 14px; display: flex; align-items: center; gap: 12px; flex: 0 0 auto;
}
header h1 { font-size: 16px; margin: 0; font-weight: 600; color: #ffffff; }
#record-count {
  font-size: 13px; color: #ffffff; background: rgba(255, 255, 255, .15);
  border: 1px solid rgba(255, 255, 255, .45); border-radius: 12px; padding: 2px 10px;
}
#btn-toggle-filters {
  display: none; margin-left: auto; font-size: 13px; padding: 5px 12px;
  border: 1px solid rgba(255, 255, 255, .6); background: transparent;
  border-radius: 6px; cursor: pointer; color: #ffffff;
}
#btn-toggle-filters:hover { background: rgba(255, 255, 255, .15); }
main {
  flex: 1 1 auto; display: grid; min-height: 0;
  grid-template-columns: 280px 1fr 400px;
}
/* ---------- left: filters ---------- */
#filter-panel {
  background: linear-gradient(to bottom, #F0F8FF 0%, #ffffff 100%);
  border-right: 1px solid var(--border);
  overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px;
  min-height: 0; color: #000000;
}
#filter-panel > * { flex: 0 0 auto; }
.filter-global { display: flex; gap: 8px; }
.filter-global button {
  flex: 1; font-size: 13px; padding: 6px 0; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
}
.filter-global button:hover { background: var(--bg); }
.filter-group { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.filter-group > summary {
  padding: 8px 10px; font-weight: 600; font-size: 13px; cursor: pointer;
  background: var(--bg); user-select: none; list-style: none;
  display: flex; justify-content: space-between; align-items: center;
}
.filter-group > summary::-webkit-details-marker { display: none; }
.filter-group > summary .chev { transition: transform .15s; font-size: 11px; color: var(--muted); }
.filter-group[open] > summary .chev { transform: rotate(90deg); }
.filter-body { padding: 6px 10px 10px; }
.filter-body label {
  display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px;
  padding: 3px 2px; cursor: pointer; line-height: 1.35;
}
.filter-body label:hover { background: var(--bg); }
.filter-body input[type="checkbox"] { margin-top: 2px; accent-color: var(--accent); flex: 0 0 auto; }
.filter-body .n { color: var(--muted); font-size: 11px; margin-left: auto; padding-left: 4px; }
/* ---------- middle: map ---------- */
#map-panel { position: relative; min-width: 0; min-height: 0; }
#map { width: 100%; height: 100%; background: #e8ecef; }
/* selected marker highlight */
.marker-selected {
  filter: drop-shadow(0 0 6px rgba(255, 212, 0, .95));
}
/* ---------- right: photo + metadata ---------- */
#detail-panel {
  background: linear-gradient(to bottom, #F0F8FF 0%, #ffffff 100%);
  border-left: 1px solid var(--border);
  overflow-y: auto; padding: 14px; color: #000000;
}
#detail-empty { color: var(--muted); font-size: 14px; text-align: center; margin-top: 40px; }
#detail-content { display: none; }
#detail-content.active { display: block; }
#detail-photo-wrap {
  background: #111; border-radius: 8px; overflow: hidden;
  display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
}
#detail-photo { max-width: 100%; max-height: 46vh; display: block; }
.meta-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.meta-table th {
  text-align: left; vertical-align: top; white-space: nowrap;
  width: 118px; padding: 6px 8px 6px 0; color: var(--muted);
  font-weight: 600; border-top: 1px solid var(--border);
}
.meta-table td { padding: 6px 0; border-top: 1px solid var(--border); word-break: break-word; }
.precision-badge {
  display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px;
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
}
/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  main { grid-template-columns: 240px 1fr 340px; }
  .meta-table th { width: 104px; }
}
@media (max-width: 960px) {
  #btn-toggle-filters { display: inline-block; }
  main { display: flex; flex-direction: column; overflow-y: auto; }
  #filter-panel {
    display: none; border-right: none; border-bottom: 1px solid var(--border);
    max-height: none; overflow: visible; flex: 0 0 auto;
  }
  #filter-panel.open { display: flex; }
  #map-panel { height: 52vh; min-height: 320px; flex: 0 0 auto; }
  #detail-panel { border-left: none; border-top: 1px solid var(--border); flex: 0 0 auto; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>1992年東涌調查Box B21照片定位</h1>
    <span id="record-count">顯示 0 / 0 筆</span>
    <button id="btn-toggle-filters" type="button">☰ 篩選</button>
  </header>
  <main>
    <aside id="filter-panel">
      <div class="filter-global">
        <button id="btn-select-all" type="button">Select all</button>
        <button id="btn-clear" type="button">Clear</button>
      </div>
      <details class="filter-group" open>
        <summary>place_name <span class="chev">▶</span></summary>
        <div class="filter-body" id="fg-place_name"></div>
      </details>
      <details class="filter-group" open>
        <summary>photo_subject <span class="chev">▶</span></summary>
        <div class="filter-body" id="fg-photo_subject"></div>
      </details>
      <details class="filter-group" open>
        <summary>location_precision <span class="chev">▶</span></summary>
        <div class="filter-body" id="fg-location_precision"></div>
      </details>
    </aside>
    <section id="map-panel">
      <div id="map"></div>
    </section>
    <aside id="detail-panel">
      <div id="detail-empty">點擊地圖上的照片 marker<br>即可在此顯示照片與 metadata</div>
      <div id="detail-content">
        <div id="detail-photo-wrap"><img id="detail-photo" alt="photo"></div>
        <table class="meta-table"><tbody id="detail-meta"></tbody></table>
      </div>
    </aside>
  </main>
</div>

<script src="js/leaflet.js"></script>
<script src="js/leaflet.markercluster.js"></script>
<script src="data/B21Notes__1.js"></script>
<script>
(function () {
  'use strict';

  // ---- data source: window.json_week5_table_tutorial_1 is not defined in this export;
  // ---- the qgis2web data file defines json_B21Notes__1, which is used here.
  var features = json_B21Notes__1.features;

  var FILTER_FIELDS = ['place_name', 'photo_subject', 'location_precision'];
  var DETAIL_FIELDS = ['file_name', 'place_name', 'capture_date', 'photo_subject',
                       'latitude', 'longitude', 'location_precision',
                       'location_source', 'notes', 'location_note'];

  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function photoUrl(props) {
    // same transform as original index.html: replace \ / : with _
    return 'images/' + String(props.photo_path).replace(/[\\/:]/g, '_').trim();
  }

  // ================= map =================
  var map = L.map('map', { zoomControl: false, maxZoom: 28, minZoom: 1 })
    .fitBounds([[22.27353734567634, 113.92722925843822], [22.29818693391274, 113.97310797922813]]);
  L.control.zoom({ position: 'topleft' }).addTo(map);

  map.createPane('pane_OPM100_2025_0');
  map.getPane('pane_OPM100_2025_0').style.zIndex = 400;
  L.imageOverlay('data/OPM100_2025_0.png',
    [[22.076205181083964, 113.75167100210537], [22.624727555473488, 114.51155829843452]],
    { pane: 'pane_OPM100_2025_0' }).addTo(map);

  map.createPane('pane_markers');
  map.getPane('pane_markers').style.zIndex = 401;

  function baseStyle() {
    return { radius: 6, opacity: 1, color: 'rgba(128,17,25,1)', weight: 2,
             fillColor: 'rgba(219,30,42,1)', fillOpacity: 1, pane: 'pane_markers' };
  }

  var cluster = L.markerClusterGroup({ showCoverageOnHover: false, spiderfyDistanceMultiplier: 2 });
  map.addLayer(cluster);

  var selectedLayer = null;

  function makeMarker(feature) {
    var layer = L.circleMarker(
      [feature.geometry.coordinates[1], feature.geometry.coordinates[0]], baseStyle());
    layer.feature = feature;
    layer.on('click', function () { selectMarker(layer); });
    return layer;
  }

  function selectMarker(layer) {
    if (selectedLayer) {
      selectedLayer.setStyle(baseStyle());
      selectedLayer.getElement() && selectedLayer.getElement().classList.remove('marker-selected');
    }
    selectedLayer = layer;
    layer.setStyle({ radius: 10, weight: 4, color: '#7a5c00', fillColor: '#ffd400' });
    // highlight via element class (works even inside spiderfied clusters)
    var el = layer.getElement();
    if (el) el.classList.add('marker-selected');
    layer.bringToFront && layer.bringToFront();
    showDetail(layer.feature.properties);
  }

  function clearSelection() {
    if (selectedLayer) {
      selectedLayer.setStyle(baseStyle());
      var el = selectedLayer.getElement();
      if (el) el.classList.remove('marker-selected');
      selectedLayer = null;
    }
  }

  // ================= filters =================
  var counts = {}; // field -> Map(value -> count)
  var checkboxes = {}; // field -> {value -> input}

  FILTER_FIELDS.forEach(function (field) {
    var m = new Map();
    features.forEach(function (f) {
      var v = f.properties[field] == null ? '(empty)' : String(f.properties[field]);
      m.set(v, (m.get(v) || 0) + 1);
    });
    counts[field] = m;
    checkboxes[field] = {};
    var body = document.getElementById('fg-' + field);
    Array.from(m.keys()).sort(function (a, b) { return a.localeCompare(b, 'zh-Hant'); })
      .forEach(function (v) {
        var label = document.createElement('label');
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.checked = true; cb.value = v;
        cb.addEventListener('change', applyFilters);
        checkboxes[field][v] = cb;
        var span = document.createElement('span');
        span.textContent = v;
        var n = document.createElement('span');
        n.className = 'n'; n.textContent = m.get(v);
        label.appendChild(cb); label.appendChild(span); label.appendChild(n);
        body.appendChild(label);
      });
  });

  function applyFilters() {
    var active = {};
    FILTER_FIELDS.forEach(function (field) {
      active[field] = new Set(Object.keys(checkboxes[field])
        .filter(function (v) { return checkboxes[field][v].checked; }));
    });
    var visible = features.filter(function (f) {
      return FILTER_FIELDS.every(function (field) {
        var v = f.properties[field] == null ? '(empty)' : String(f.properties[field]);
        return active[field].has(v);
      });
    });
    clearSelection();
    cluster.clearLayers();
    visible.forEach(function (f) { cluster.addLayer(makeMarker(f)); });
    document.getElementById('record-count').textContent =
      '顯示 ' + visible.length + ' / ' + features.length + ' 筆';
  }

  document.getElementById('btn-select-all').addEventListener('click', function () {
    FILTER_FIELDS.forEach(function (field) {
      Object.keys(checkboxes[field]).forEach(function (v) { checkboxes[field][v].checked = true; });
    });
    applyFilters();
  });
  document.getElementById('btn-clear').addEventListener('click', function () {
    FILTER_FIELDS.forEach(function (field) {
      Object.keys(checkboxes[field]).forEach(function (v) { checkboxes[field][v].checked = false; });
    });
    applyFilters();
  });
  document.getElementById('btn-toggle-filters').addEventListener('click', function () {
    document.getElementById('filter-panel').classList.toggle('open');
  });

  // ================= detail panel =================
  var FIELD_LABELS = {
    file_name: 'file_name', place_name: 'place_name', capture_date: 'capture_date',
    photo_subject: 'photo_subject', latitude: 'latitude', longitude: 'longitude',
    location_precision: 'location_precision', location_source: 'location_source',
    notes: 'notes', location_note: 'location_note'
  };

  function showDetail(props) {
    document.getElementById('detail-empty').style.display = 'none';
    document.getElementById('detail-content').classList.add('active');
    var img = document.getElementById('detail-photo');
    img.onerror = function () { img.alt = '找不到圖片：' + photoUrl(props); img.src = ''; };
    img.src = photoUrl(props);
    img.alt = props.file_name || 'photo';
    var tb = document.getElementById('detail-meta');
    tb.innerHTML = '';
    DETAIL_FIELDS.forEach(function (field) {
      var tr = document.createElement('tr');
      var th = document.createElement('th');
      th.scope = 'row'; th.textContent = FIELD_LABELS[field];
      var td = document.createElement('td');
      var v = props[field];
      if (field === 'location_precision' && v != null) {
        td.innerHTML = '<span class="precision-badge">' + esc(v) + '</span>';
      } else if (field === 'latitude' || field === 'longitude') {
        td.textContent = (v == null) ? '' : Number(v).toFixed(6);
      } else {
        td.textContent = (v == null) ? '' : String(v);
      }
      tr.appendChild(th); tr.appendChild(td);
      tb.appendChild(tr);
    });
  }

  applyFilters();
})();
</script>
</body>
</html>
